<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bom de Minas · protótipo mobile</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(circle at 50% 30%,#3a2a20,#15100c 70%);display:grid;place-items:center;overflow:hidden;font-family:system-ui,sans-serif;color:#f4ecdc}
  .palco{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:18px}
  .celular{position:relative;width:414px;height:868px;padding:12px;border-radius:64px;background:#0b0b0b;box-shadow:0 0 0 2px #2b2b2b,0 0 0 5px #121212,0 40px 90px -20px rgba(0,0,0,.8)}
  .celular iframe{width:390px;height:844px;border:0;border-radius:52px;display:block;background:#15100c}
  .ilha{position:absolute;top:24px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000;z-index:2;pointer-events:none}
  .legenda{font-size:14px;opacity:.7;letter-spacing:.04em}
</style>
</head>
<body>
  <div class="palco" id="palco">
    <div class="celular">
      <div class="ilha"></div>
      <iframe src="index.html" title="Site Bom de Minas no celular"></iframe>
    </div>
    <div class="legenda">Bom de Minas · iPhone 390×844 · role dentro da tela</div>
  </div>
<script>
  /* encaixa o celular na altura da janela sem mudar o tamanho real da tela dele */
  const palco = document.getElementById('palco');
  const ajustar = () => palco.style.transform = `translate(-50%,-50%) scale(${Math.min(1, (innerHeight - 32) / palco.offsetHeight, (innerWidth - 32) / palco.offsetWidth)})`;
  addEventListener('resize', ajustar); ajustar();
  /* celular não tem barra de rolagem lateral: esconde a do iframe para a tela ficar com 390px úteis */
  const tela = document.querySelector('iframe');
  tela.addEventListener('load', () => {
    const s = tela.contentDocument.createElement('style');
    s.textContent = 'html{scrollbar-width:none}::-webkit-scrollbar{display:none}';
    tela.contentDocument.head.append(s);
  });
</script>
</body>
</html>
